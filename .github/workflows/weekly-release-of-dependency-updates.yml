name: Weekly Release of Dependency Updates

on:
  schedule:
    - cron: "0 2 * * 5" # every Friday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-dependency-release
  cancel-in-progress: false

jobs:
  release:
    uses: js-soft/github-actions/.github/workflows/release-dependency-updates.yml@9ec9e34b26144d4ec07604d2c1818dddb2377dab # main
    secrets:
      github-token: ${{ secrets.GH_PAT }}
