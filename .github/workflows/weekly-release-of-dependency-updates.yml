name: Weekly Release of Dependency Updates

on:
  schedule:
    - cron: "0 2 * * 5" # every Friday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-dependency-release
  cancel-in-progress: false

jobs:
  release:
    uses: js-soft/github-actions/.github/workflows/release-dependency-updates.yml@72ba36c37ec67fba7f8d977c0556e4d3462b1366 # main
    secrets:
      github-token: ${{ secrets.GH_PAT }}
