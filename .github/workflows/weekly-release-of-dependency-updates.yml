name: Weekly Release of Dependency Updates

on:
  schedule:
    - cron: "0 2 * * 5" # every Friday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-dependency-release
  cancel-in-progress: false

jobs:
  release:
    uses: js-soft/github-actions/.github/workflows/release-dependency-updates.yml@e053ca27e4d199114b17be00f32717a43d5feea3 # main
    secrets:
      github-token: ${{ secrets.GH_PAT }}
