name: Dependency Security Maintenance

on:
  schedule:
    - cron: "0 2 * * 2" # every Tuesday at 02:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  npm-audit:
    uses: js-soft/github-actions/.github/workflows/dependency-security-maintenance.yml@72ba36c37ec67fba7f8d977c0556e4d3462b1366 # main
    with:
      reviewers: nmshd/npm-dependency-update-reviewers
    secrets:
      github-token: ${{ secrets.GH_PAT }}
