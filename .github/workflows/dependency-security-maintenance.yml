name: Dependency Security Maintenance

on:
  schedule:
    - cron: "0 2 * * 2" # every Tuesday at 02:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  npm-audit:
    uses: js-soft/github-actions/.github/workflows/dependency-security-maintenance.yml@9ec9e34b26144d4ec07604d2c1818dddb2377dab # main
    with:
      reviewers: nmshd/npm-dependency-update-reviewers
    secrets:
      github-token: ${{ secrets.GH_PAT }}
