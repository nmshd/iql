name: Dependency Security Maintenance

on:
  schedule:
    - cron: "0 2 * * 2" # every Tuesday at 02:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  npm-audit:
    uses: js-soft/github-actions/.github/workflows/dependency-security-maintenance.yml@8f1636892c12ce417e7fde8d5d87ff4ccb5bad58 # main
    with:
      reviewers: nmshd/npm-dependency-update-reviewers
    secrets:
      github-token: ${{ secrets.GH_PAT }}
